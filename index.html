<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini AI SaaS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{background:#f7f8fa;height:100vh;display:flex;flex-direction:column}
    header{padding:16px;background:#2563eb;color:white;text-align:center;font-size:20px;font-weight:600}
    #chat-box{flex:1;overflow-y:auto;padding:16px;max-width:900px;margin:0 auto;width:100%}
    .msg{margin:12px 0;max-width:80%}
    .user{margin-left:auto}
    .user .bubble{background:#2563eb;color:white;border-radius:16px 16px 4px 16px;padding:12px 16px}
    .ai .bubble{background:#ffffff;border:1px solid #e5e7eb;border-radius:16px 16px 16px 4px;padding:12px 16px}
    .input-area{display:flex;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #e5e7eb}
    #prompt{flex:1;padding:12px 14px;border:1px solid #d1d5db;border-radius:999px;font-size:16px;outline:none}
    #send{padding:12px 22px;background:#2563eb;color:white;border:none;border-radius:999px;cursor:pointer;font-size:16px}
  </style>
</head>
<body>
<header>Mini‑S‑01 AI对话</header>
<div id="chat-box"></div>
<div class="input-area">
  <input id="prompt" placeholder="请输入问题..."/>
  <button id="send">发送</button>
</div>
<script>
const chatBox = document.getElementById('chat-box');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');

function addMsg(text, role){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${text}</div>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function send(){
  const text = promptEl.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  promptEl.value = '';
  addMsg("正在思考...", 'ai');
  try{
    const res = await fetch('http://43.159.142.220:3000/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})
    });
    const data = await res.json();
    chatBox.removeChild(chatBox.lastChild);
    addMsg(data.reply, 'ai');
  }catch(e){
    chatBox.removeChild(chatBox.lastChild);
    addMsg("连接出错，请稍后再试", 'ai');
  }
}

sendBtn.onclick = send;
promptEl.addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
